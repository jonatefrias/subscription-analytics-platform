# Credentials always come from environment variables; nothing secret lives in the repo.
subscription_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/tmp/ci_warehouse.duckdb') }}"
      threads: 4
    # Local DuckLake (DuckDB catalog file + Parquet data) that the Lightdash container reads.
    # LAKE_DIR must be an absolute path: the same path is mounted inside the container.
    lightdash:
      type: duckdb
      path: ":memory:"
      database: ducklake
      schema: main
      threads: 1
      extensions: [ducklake]
      attach:
        - alias: ducklake
          path: "ducklake:{{ env_var('LAKE_DIR', '../data/lake') }}/catalog.duckdb"
          options:
            data_path: "{{ env_var('LAKE_DIR', '../data/lake') }}/data"
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'DBT_DEV') }}"
      threads: 8
