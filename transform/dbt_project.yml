name: subscription_analytics
version: "1.0.0"
config-version: 2
profile: subscription_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Raw data is complete up to the day before this date (00:00 UTC).
  as_of_date: "2026-11-01"
  reporting_start_month: "2024-01-01"
  # A trial counts as converted if the first successful charge happens within this window.
  trial_conversion_window_days: 14
  # Budget FX year: MRR is reported at constant FX so currency moves do not look like churn.
  constant_fx_year: 2025

models:
  subscription_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance
      product:
        +schema: product
      marketing:
        +schema: marketing
      experiments:
        +schema: experiments

seeds:
  subscription_analytics:
    +schema: reference
