version: 2

models:
  - name: fct_playback_daily
    description: Customer x day engagement (incremental, 3-day lookback for late events).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, activity_date]

  - name: fct_cohort_retention
    description: Paying-customer retention curves by first-paid cohort.
    config:
      tags: [lightdash]
      meta:
        metrics:
          # no MetricFlow definition exists for cohorts, so this one is native to Lightdash;
          # a ratio of sums, never an average of the stored rate
          cohort_retention_rate:
            type: number
            label: Cohort retention rate
            description: Customers still paying over customers in the cohort.
            sql: ${retained_customers_total} * 1.0 / nullif(${cohort_customers_total}, 0)
            format: "0.0%"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, months_since_first_paid]
    columns:
      - {name: cohort_month, description: Month of the first successful payment.}
      - {name: months_since_first_paid, description: Months elapsed since the cohort month.}
      - name: cohort_customers
        description: Customers in the cohort.
        config:
          meta:
            metrics:
              cohort_customers_total: {type: sum, label: Cohort customers}
      - name: retained_customers
        description: Customers of the cohort still paying in that month.
        config:
          meta:
            metrics:
              retained_customers_total: {type: sum, label: Retained customers}
      - name: retention_rate
        description: retained_customers / cohort_customers for this row. Do not average it across rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
