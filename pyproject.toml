[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # raised inside third-party packages, not by this project's code
    "ignore::DeprecationWarning:dagster_dbt.*",
    "ignore::DeprecationWarning:sqlglotrs.*",
]

[tool.dagster]
module_name = "orchestration.definitions"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, subprocess without check=
select = ["E", "F", "I", "UP", "B", "PLW1510"]
